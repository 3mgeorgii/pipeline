name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check bot/ tests/

      - name: Mypy
        run: mypy bot/ tests/

      - name: Pytest
        env:
          BOT_TOKEN: "dummy:dummy"
        run: pytest tests/ -v
