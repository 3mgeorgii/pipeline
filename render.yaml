# Render Blueprint — https://render.com/docs/infrastructure-as-code
#
# Generated by scripts/gen_render_yaml.py — DO NOT hand-edit individual
# service blocks. Edit bot/persona.py to add/rename personas, then
# regenerate:
#
#     python scripts/gen_render_yaml.py --first 5      # current farm
#     python scripts/gen_render_yaml.py                # full 20-bot farm
#
# Usage on Render:
#   1. https://dashboard.render.com → New + → Blueprint
#   2. Connect this GitHub repo
#   3. Render reads this file and asks for each service's BOT_TOKEN
#   4. Apply → each service auto-deploys with its own 1GB persistent disk
#   5. /start each bot in Telegram → claim ownership → /setup → API key

services:

  # ===== 1. Lilush Boss =================================================
  - type: web
    name: lilush-boss
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_PERSONA
        value: boss
      - key: BOT_TOKEN
        sync: false        # set in Render dashboard
      - key: BOT_MODE
        value: polling
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: ALLOWED_USER_IDS
        sync: false
    disk:
      name: lilush-boss-data
      mountPath: /data
      sizeGB: 1

